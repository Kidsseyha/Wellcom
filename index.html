    <script>
      (function() {
        function isIgnored(msg) {
          if (!msg) return false;
          var str = String(msg).toLowerCase();
          return (
            str.indexOf('$$typeof') !== -1 ||
            str.indexOf('cross-origin') !== -1 ||
            str.indexOf('blocked a frame') !== -1 ||
            str.indexOf('should not already be working') !== -1 ||
            str.indexOf('securityerror') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('failed to connect to websocket') !== -1 ||
            str.indexOf('closed without opened') !== -1
          );
        }

        // 1. Native window.onerror returns true to suppress uncaught exceptions in browser
        var origOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (isIgnored(message) || (error && isIgnored(error.message))) {
            return true;
          }
          if (typeof origOnError === 'function') {
            return origOnError.apply(this, arguments);
          }
          return false;
        };

        // 2. Capture phase error listener to cancel unhandled errors
        window.addEventListener(
          'error',
          function(event) {
            if (isIgnored(event.message) || (event.error && isIgnored(event.error.message))) {
              event.preventDefault();
              event.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        // 3. Unhandled promise rejection listener
        window.addEventListener(
          'unhandledrejection',
          function(event) {
            var msg = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (isIgnored(msg)) {
              event.preventDefault();
              event.stopImmediatePropagation();
            }
          },
          true
        );

        // 4. Safe fallback for $$typeof on window prototype
        try {
          if (typeof Window !== 'undefined' && Window.prototype) {
            Object.defineProperty(Window.prototype, '$$typeof', {
              get: function() { return undefined; },
              set: function() {},
              configurable: true,
              enumerable: false
            });
          }
        } catch (e) {}
      })();
    </script>
